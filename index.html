<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanki · Banco de Maquetas por Ambiente</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #161616;
  --surface-elev: #1f1f1f;
  --border: #2a2a2a;
  --text: #f5f5f5;
  --text-dim: #888;
  --accent: #ff6b00;
  --gh: #2da44e;
  --qas: #f59e0b;
  --prd: #ef4444;
  --local: #6366f1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
body { padding: 24px 16px 80px; }

.header { max-width: 1400px; margin: 0 auto 24px; }
.header h1 { font-size: clamp(20px, 4vw, 32px); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
.header h1 .skate { display: inline-block; transform: rotate(-8deg); margin-right: 6px; }
.header p { color: var(--text-dim); font-size: 14px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; max-width: 1400px; margin-left: auto; margin-right: auto; }
.filter {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.filter:hover { background: var(--surface-elev); border-color: var(--accent); }
.filter.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.filter .dot { width: 8px; height: 8px; border-radius: 50%; }

main { max-width: 1400px; margin: 0 auto; }

.env-section { margin: 32px 0; }
.env-section.hidden { display: none; }
.env-header {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--border); margin-bottom: 16px;
}
.env-badge {
  padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase;
}
.env-badge.gh-maquetas { background: var(--gh); color: #fff; }
.env-badge.gh-preview { background: var(--gh); color: #fff; opacity: 0.7; }
.env-badge.qas { background: var(--qas); color: #000; }
.env-badge.prd { background: var(--prd); color: #fff; }
.env-title { font-size: 15px; font-weight: 600; }
.env-url { font-size: 12px; color: var(--text-dim); font-family: 'SF Mono', Menlo, monospace; }
.env-url a { color: var(--text-dim); text-decoration: none; }
.env-url a:hover { color: var(--accent); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; cursor: pointer; transition: all 0.25s ease;
  position: relative; display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 40px rgba(255, 107, 0, 0.2); }

.card-preview {
  position: relative; aspect-ratio: 16 / 10; overflow: hidden;
  background: #000; border-bottom: 1px solid var(--border);
}
.card-preview iframe {
  width: 250%; height: 250%; border: 0; pointer-events: none;
  transform: scale(0.4); transform-origin: 0 0;
  background: #fff;
}
.card-preview .overlay {
  position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 50%);
  opacity: 0; transition: opacity 0.25s; pointer-events: none;
  display: flex; align-items: flex-end; padding: 12px; font-size: 11px; color: #fff;
  font-family: 'SF Mono', Menlo, monospace;
}
.card:hover .card-preview .overlay { opacity: 1; }
.card-preview .ext-icon {
  position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.25s; font-size: 14px;
}
.card:hover .card-preview .ext-icon { opacity: 1; }

.card-body { padding: 12px 14px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 8px; align-items: center; }
.card-meta .file { font-family: 'SF Mono', Menlo, monospace; }

.empty-state { text-align: center; color: var(--text-dim); padding: 48px 16px; font-size: 14px; }

footer { max-width: 1400px; margin: 60px auto 0; padding-top: 24px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 12px; text-align: center; }
footer a { color: var(--accent); text-decoration: none; }

@media (max-width: 640px) {
  body { padding: 16px 12px 60px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .card-preview iframe { transform: scale(0.3); width: 333%; height: 333%; }
  .header h1 { font-size: 22px; }
  .env-header { flex-wrap: wrap; }
}
@media (max-width: 420px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span class="skate">🛹</span>Kanki · Banco de Maquetas por Ambiente</h1>
  <p>16 páginas × 4 ambientes · click en cualquier card para abrir la página real</p>
</div>

<div class="filters" id="filters">
  <button class="filter active" data-env="all">Todos</button>
  <button class="filter" data-env="gh-maquetas"><span class="dot" style="background:var(--gh)"></span>GitHub Maquetas</button>
  <button class="filter" data-env="gh-preview"><span class="dot" style="background:var(--gh);opacity:.7"></span>GitHub Preview</button>
  <button class="filter" data-env="qas"><span class="dot" style="background:var(--qas)"></span>AWS QAS</button>
  <button class="filter" data-env="prd"><span class="dot" style="background:var(--prd)"></span>AWS PRD</button>
</div>

<main id="banco"></main>

<footer>
  Banco generado automaticamente · <a href="https://github.com/SmartConnection-CodeHub/kanki-maquetas" target="_blank">repo en GitHub</a> · creado War Room 2026-05-25
</footer>

<script>
const ENVS = {
  'gh-maquetas': {
    name: 'GitHub Maquetas',
    desc: 'kanki-maquetas · sirviendo directo desde GH Pages',
    url: 'https://smartconnection-codehub.github.io/kanki-maquetas/',
    base: 'https://smartconnection-codehub.github.io/kanki-maquetas/',
    badgeClass: 'gh-maquetas'
  },
  'gh-preview': {
    name: 'GitHub Preview',
    desc: 'kanki-preview · espejo sin custom domain',
    url: 'https://smartconnection-codehub.github.io/kanki-preview/',
    base: 'https://smartconnection-codehub.github.io/kanki-preview/',
    badgeClass: 'gh-preview'
  },
  'qas': {
    name: 'AWS QAS',
    desc: 'qas.kanki.smconnection.cl · S3 + CloudFront (War Room 2026-05-25)',
    url: 'https://qas.kanki.smconnection.cl/',
    base: 'https://qas.kanki.smconnection.cl/',
    badgeClass: 'qas'
  },
  'prd': {
    name: 'AWS PRD',
    desc: 'kanki.smconnection.cl · app real con Supabase',
    url: 'https://kanki.smconnection.cl/',
    base: 'https://kanki.smconnection.cl/',
    badgeClass: 'prd'
  }
};

const PAGES_STATIC = [
  { file: 'storefront.html', title: 'Storefront', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'storefront-v2.html', title: 'Storefront v2', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'storefront-classic.html', title: 'Storefront Classic', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'producto-detalle.html', title: 'Producto Detalle', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'admin.html', title: 'Panel Admin', envs: ['gh-maquetas','gh-preview','qas','prd'] },
  { file: 'panel-socios.html', title: 'Panel Socios', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'embajadores/', title: 'Embajadores', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'login-emails.html', title: 'Login & Emails', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'arquitectura.html', title: 'Arquitectura', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'maquetas.html', title: 'Maquetas', envs: ['gh-maquetas','gh-preview','qas'] },
  { file: 'reunion-barbara-fondos-publicos.html', title: 'Reunion Barbara', envs: ['gh-maquetas','gh-preview','qas'] }
];

const PAGES_PRD_ONLY = [
  { file: 'index.html', title: 'Storefront (real)', envs: ['prd'] },
  { file: 'productos.html', title: 'Productos', envs: ['prd'] },
  { file: 'carrito.html', title: 'Carrito', envs: ['prd'] }
];

function buildCard(envKey, page) {
  const env = ENVS[envKey];
  const url = env.base + page.file;
  return `
    <a class="card" href="${url}" target="_blank" rel="noopener">
      <div class="card-preview">
        <iframe src="${url}" loading="lazy" sandbox="allow-scripts allow-same-origin" title="${page.title}"></iframe>
        <div class="ext-icon">↗</div>
        <div class="overlay">${url}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${page.title}</div>
        <div class="card-meta"><span class="file">${page.file}</span></div>
      </div>
    </a>
  `;
}

function renderBanco() {
  const main = document.getElementById('banco');
  let html = '';
  for (const [envKey, env] of Object.entries(ENVS)) {
    const allPages = [...PAGES_STATIC, ...PAGES_PRD_ONLY].filter(p => p.envs.includes(envKey));
    if (!allPages.length) continue;
    html += `
      <section class="env-section" data-env="${envKey}">
        <div class="env-header">
          <span class="env-badge ${env.badgeClass}">${env.name}</span>
          <div>
            <div class="env-title">${env.desc}</div>
            <div class="env-url"><a href="${env.url}" target="_blank" rel="noopener">${env.url}</a></div>
          </div>
        </div>
        <div class="grid">
          ${allPages.map(p => buildCard(envKey, p)).join('')}
        </div>
      </section>
    `;
  }
  main.innerHTML = html;
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter')) return;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  const env = e.target.dataset.env;
  document.querySelectorAll('.env-section').forEach(s => {
    s.classList.toggle('hidden', env !== 'all' && s.dataset.env !== env);
  });
});

renderBanco();
</script>

</body>
</html>
